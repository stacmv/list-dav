version: '3.8'

services:
  listdav:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./var/data:/app/var/data
      - ./.env:/app/.env:ro
    environment:
      - APP_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Development service with live reload
  listdav-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:80"
    volumes:
      - .:/app
      - /app/vendor
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
    profiles:
      - dev
