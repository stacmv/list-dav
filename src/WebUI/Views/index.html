<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ListDAV - File Manager</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Toolbar */
        .toolbar {
            background: #333;
            padding: 8px 16px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid #444;
        }

        .toolbar button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .toolbar button:hover {
            background: #1177bb;
        }

        .toolbar button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .toolbar .shortcut {
            color: #888;
            font-size: 10px;
            margin-left: 4px;
        }

        /* Main panels */
        .panels {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #444;
        }

        .panel:last-child {
            border-right: none;
        }

        .panel.active {
            background: #252526;
        }

        .path-bar {
            background: #3c3c3c;
            padding: 8px 12px;
            font-size: 12px;
            border-bottom: 1px solid #444;
            display: flex;
            align-items: center;
        }

        .path-bar input {
            flex: 1;
            background: #1e1e1e;
            border: 1px solid #444;
            color: #d4d4d4;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            cursor: pointer;
            border-bottom: 1px solid #2d2d2d;
        }

        .file-item:hover {
            background: #2a2d2e;
        }

        .file-item.selected {
            background: #094771;
        }

        .file-item .icon {
            width: 20px;
            margin-right: 8px;
            text-align: center;
        }

        .file-item .name {
            flex: 1;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item .size {
            font-size: 11px;
            color: #888;
            margin-left: 8px;
        }

        .file-item .date {
            font-size: 11px;
            color: #888;
            margin-left: 8px;
            width: 120px;
        }

        /* Status bar */
        .status-bar {
            background: #007acc;
            padding: 4px 12px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: #2d2d2d;
            border-radius: 8px;
            padding: 20px;
            min-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .modal h3 {
            margin-bottom: 16px;
        }

        .modal input {
            width: 100%;
            padding: 8px;
            background: #1e1e1e;
            border: 1px solid #444;
            color: #d4d4d4;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .modal-buttons button {
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        .modal-buttons .cancel {
            background: #444;
            color: #d4d4d4;
            border: none;
        }

        .modal-buttons .confirm {
            background: #0e639c;
            color: white;
            border: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .panels {
                flex-direction: column;
            }

            .panel {
                display: none;
                border-right: none;
                border-bottom: 1px solid #444;
            }

            .panel.active {
                display: flex;
            }
        }
    </style>
</head>
<body x-data="fileManager()">
    <!-- Toolbar -->
    <div class="toolbar">
        <button @click="refresh()" title="Refresh">
            ↻ Refresh
        </button>
        <button @click="copy()" :disabled="!hasSelection" title="Copy">
            Copy <span class="shortcut">F5</span>
        </button>
        <button @click="move()" :disabled="!hasSelection" title="Move">
            Move <span class="shortcut">F6</span>
        </button>
        <button @click="showNewFolderModal()" title="New Folder">
            New Folder <span class="shortcut">F7</span>
        </button>
        <button @click="deleteSelected()" :disabled="!hasSelection" title="Delete">
            Delete <span class="shortcut">F8</span>
        </button>
        <button @click="showRenameModal()" :disabled="selectedItems.length !== 1" title="Rename">
            Rename
        </button>
    </div>

    <!-- Panels -->
    <div class="panels">
        <!-- Left Panel -->
        <div class="panel" :class="{ 'active': activePanel === 'left' }" @click="activePanel = 'left'">
            <div class="path-bar">
                <input type="text" x-model="leftPath" @keydown.enter="navigate('left', leftPath)">
            </div>
            <div class="file-list">
                <template x-for="item in leftItems" :key="item.path">
                    <div class="file-item"
                         :class="{ 'selected': isSelected('left', item) }"
                         @click="selectItem('left', item, $event)"
                         @dblclick="open('left', item)">
                        <span class="icon" x-text="item.isDir ? '📁' : '📄'"></span>
                        <span class="name" x-text="item.name"></span>
                        <span class="size" x-text="item.isDir ? '' : formatSize(item.size)"></span>
                    </div>
                </template>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="panel" :class="{ 'active': activePanel === 'right' }" @click="activePanel = 'right'">
            <div class="path-bar">
                <input type="text" x-model="rightPath" @keydown.enter="navigate('right', rightPath)">
            </div>
            <div class="file-list">
                <template x-for="item in rightItems" :key="item.path">
                    <div class="file-item"
                         :class="{ 'selected': isSelected('right', item) }"
                         @click="selectItem('right', item, $event)"
                         @dblclick="open('right', item)">
                        <span class="icon" x-text="item.isDir ? '📁' : '📄'"></span>
                        <span class="name" x-text="item.name"></span>
                        <span class="size" x-text="item.isDir ? '' : formatSize(item.size)"></span>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <span x-text="selectedItems.length + ' selected'"></span>
        <span>ListDAV v1.0.0</span>
    </div>

    <!-- New Folder Modal -->
    <div class="modal-overlay" x-show="showModal === 'newFolder'" @click.self="showModal = null">
        <div class="modal">
            <h3>New Folder</h3>
            <input type="text" x-model="newFolderName" placeholder="Folder name" @keydown.enter="createFolder()">
            <div class="modal-buttons">
                <button class="cancel" @click="showModal = null">Cancel</button>
                <button class="confirm" @click="createFolder()">Create</button>
            </div>
        </div>
    </div>

    <!-- Rename Modal -->
    <div class="modal-overlay" x-show="showModal === 'rename'" @click.self="showModal = null">
        <div class="modal">
            <h3>Rename</h3>
            <input type="text" x-model="renameValue" @keydown.enter="rename()">
            <div class="modal-buttons">
                <button class="cancel" @click="showModal = null">Cancel</button>
                <button class="confirm" @click="rename()">Rename</button>
            </div>
        </div>
    </div>

    <script>
        function fileManager() {
            return {
                activePanel: 'left',
                leftPath: '/',
                rightPath: '/youtube/playlists',
                leftItems: [],
                rightItems: [],
                selectedItems: [],
                showModal: null,
                newFolderName: '',
                renameValue: '',

                get hasSelection() {
                    return this.selectedItems.length > 0;
                },

                init() {
                    this.loadDemo();
                    this.setupKeyboard();
                },

                loadDemo() {
                    // Demo data
                    this.leftItems = [
                        { name: 'youtube', path: '/youtube', isDir: true, size: 0 },
                        { name: 'views', path: '/views', isDir: true, size: 0 },
                        { name: 'trash', path: '/trash', isDir: true, size: 0 },
                    ];

                    this.rightItems = [
                        { name: 'Music', path: '/youtube/playlists/Music', isDir: true, size: 0 },
                        { name: 'Tutorials', path: '/youtube/playlists/Tutorials', isDir: true, size: 0 },
                        { name: 'Watch Later', path: '/youtube/playlists/Watch Later', isDir: true, size: 0 },
                    ];
                },

                setupKeyboard() {
                    document.addEventListener('keydown', (e) => {
                        if (this.showModal) return;

                        switch(e.key) {
                            case 'Tab':
                                e.preventDefault();
                                this.switchPanel();
                                break;
                            case 'F5':
                                e.preventDefault();
                                this.copy();
                                break;
                            case 'F6':
                                e.preventDefault();
                                this.move();
                                break;
                            case 'F7':
                                e.preventDefault();
                                this.showNewFolderModal();
                                break;
                            case 'F8':
                            case 'Delete':
                                e.preventDefault();
                                this.deleteSelected();
                                break;
                            case 'Enter':
                                if (this.selectedItems.length === 1) {
                                    this.open(this.activePanel, this.selectedItems[0]);
                                }
                                break;
                            case ' ':
                                e.preventDefault();
                                // Toggle selection
                                break;
                            case 'a':
                                if (e.ctrlKey) {
                                    e.preventDefault();
                                    this.selectAll();
                                }
                                break;
                        }
                    });
                },

                switchPanel() {
                    this.activePanel = this.activePanel === 'left' ? 'right' : 'left';
                },

                navigate(panel, path) {
                    // Load contents from WebDAV
                    console.log('Navigate', panel, path);
                },

                selectItem(panel, item, event) {
                    if (event.ctrlKey) {
                        const index = this.selectedItems.findIndex(i => i.path === item.path);
                        if (index >= 0) {
                            this.selectedItems.splice(index, 1);
                        } else {
                            this.selectedItems.push(item);
                        }
                    } else {
                        this.selectedItems = [item];
                    }
                    this.activePanel = panel;
                },

                isSelected(panel, item) {
                    return this.selectedItems.some(i => i.path === item.path);
                },

                open(panel, item) {
                    if (item.isDir) {
                        if (panel === 'left') {
                            this.leftPath = item.path;
                        } else {
                            this.rightPath = item.path;
                        }
                        this.navigate(panel, item.path);
                    } else {
                        // Open file
                        window.open(item.path, '_blank');
                    }
                },

                selectAll() {
                    const items = this.activePanel === 'left' ? this.leftItems : this.rightItems;
                    this.selectedItems = [...items];
                },

                refresh() {
                    this.navigate('left', this.leftPath);
                    this.navigate('right', this.rightPath);
                },

                copy() {
                    if (!this.hasSelection) return;
                    const dest = this.activePanel === 'left' ? this.rightPath : this.leftPath;
                    console.log('Copy', this.selectedItems, 'to', dest);
                    alert('Copy operation: ' + this.selectedItems.map(i => i.name).join(', ') + ' to ' + dest);
                },

                move() {
                    if (!this.hasSelection) return;
                    const dest = this.activePanel === 'left' ? this.rightPath : this.leftPath;
                    console.log('Move', this.selectedItems, 'to', dest);
                    alert('Move operation: ' + this.selectedItems.map(i => i.name).join(', ') + ' to ' + dest);
                },

                deleteSelected() {
                    if (!this.hasSelection) return;
                    if (confirm('Delete ' + this.selectedItems.length + ' item(s)?')) {
                        console.log('Delete', this.selectedItems);
                        this.selectedItems = [];
                    }
                },

                showNewFolderModal() {
                    this.newFolderName = '';
                    this.showModal = 'newFolder';
                },

                createFolder() {
                    if (this.newFolderName) {
                        const path = this.activePanel === 'left' ? this.leftPath : this.rightPath;
                        console.log('Create folder', this.newFolderName, 'in', path);
                        alert('Created folder: ' + this.newFolderName);
                        this.showModal = null;
                    }
                },

                showRenameModal() {
                    if (this.selectedItems.length === 1) {
                        this.renameValue = this.selectedItems[0].name;
                        this.showModal = 'rename';
                    }
                },

                rename() {
                    if (this.renameValue && this.selectedItems.length === 1) {
                        console.log('Rename', this.selectedItems[0].path, 'to', this.renameValue);
                        alert('Renamed to: ' + this.renameValue);
                        this.showModal = null;
                    }
                },

                formatSize(bytes) {
                    if (bytes === 0) return '';
                    const units = ['B', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(1024));
                    return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + units[i];
                }
            };
        }
    </script>
</body>
</html>
