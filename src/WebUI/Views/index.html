<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ListDAV - File Manager</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .toolbar {
            background: #333;
            padding: 8px 16px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid #444;
            flex-wrap: wrap;
        }
        .toolbar button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .toolbar button:hover { background: #1177bb; }
        .toolbar button:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }
        .toolbar .shortcut { color: rgba(255,255,255,0.6); font-size: 10px; margin-left: 4px; }
        .toolbar .spacer { flex: 1; }
        .toolbar input {
            background: #1e1e1e;
            border: 1px solid #444;
            color: #d4d4d4;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
        .panels { flex: 1; display: flex; overflow: hidden; }
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #444;
        }
        .panel:last-child { border-right: none; }
        .panel.active .path-bar { background: #094771; }
        .path-bar {
            background: #3c3c3c;
            padding: 8px 12px;
            font-size: 12px;
            border-bottom: 1px solid #444;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .path-bar input { flex: 1; background: #1e1e1e; border: 1px solid #444; color: #d4d4d4; padding: 4px 8px; border-radius: 3px; }
        .path-bar button { background: #444; border: none; color: #d4d4d4; padding: 4px 8px; border-radius: 3px; cursor: pointer; }
        .path-bar button:hover { background: #555; }
        .file-list { flex: 1; overflow-y: auto; }
        .file-header {
            display: flex;
            padding: 6px 12px;
            background: #2d2d2d;
            border-bottom: 1px solid #444;
            font-size: 11px;
            color: #888;
        }
        .col-name { flex: 1; }
        .col-size { width: 80px; text-align: right; }
        .col-date { width: 130px; text-align: right; }
        .file-item {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            cursor: pointer;
            border-bottom: 1px solid #2d2d2d;
        }
        .file-item:hover { background: #2a2d2e; }
        .file-item.selected { background: #094771; }
        .file-item .icon { width: 20px; margin-right: 8px; text-align: center; }
        .file-item .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
        .file-item .size { width: 80px; text-align: right; font-size: 11px; color: #888; }
        .file-item .date { width: 130px; text-align: right; font-size: 11px; color: #888; }
        .loading, .error-msg, .empty { text-align: center; padding: 20px; color: #888; }
        .error-msg { color: #f44; }
        .status-bar {
            background: #007acc;
            padding: 4px 12px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: #2d2d2d;
            border-radius: 8px;
            padding: 20px;
            min-width: 400px;
        }
        .modal h3 { margin-bottom: 16px; }
        .modal input {
            width: 100%;
            padding: 8px;
            background: #1e1e1e;
            border: 1px solid #444;
            color: #d4d4d4;
            border-radius: 4px;
            margin-bottom: 16px;
        }
        .modal-btns { display: flex; justify-content: flex-end; gap: 8px; }
        .modal-btns button { padding: 8px 16px; border-radius: 4px; cursor: pointer; border: none; }
        .modal-btns .cancel { background: #444; color: #d4d4d4; }
        .modal-btns .confirm { background: #0e639c; color: white; }
        .modal-btns .danger { background: #c00; color: white; }
        .toast-box { position: fixed; bottom: 40px; right: 20px; z-index: 1001; }
        .toast {
            background: #333;
            color: #fff;
            padding: 12px 20px;
            border-radius: 4px;
            margin-top: 8px;
            animation: slideIn 0.3s ease;
        }
        .toast.success { border-left: 4px solid #4caf50; }
        .toast.error { border-left: 4px solid #f44336; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        [x-cloak] { display: none !important; }
        @media (max-width: 768px) {
            .panels { flex-direction: column; }
            .panel { display: none; }
            .panel.active { display: flex; }
            .col-date { display: none; }
        }
    </style>
</head>
<body x-data="fm()" x-init="init()">
    <div class="toolbar">
        <button @click="refresh()">↻ Refresh</button>
        <button @click="goUp()" :disabled="currentPath==='/'">↑ Up</button>
        <button @click="modal='copy'" :disabled="!sel.length">Copy <span class="shortcut">F5</span></button>
        <button @click="modal='move'" :disabled="!sel.length">Move <span class="shortcut">F6</span></button>
        <button @click="modal='mkdir'">New Folder <span class="shortcut">F7</span></button>
        <button @click="modal='delete'" :disabled="!sel.length">Delete <span class="shortcut">F8</span></button>
        <button @click="modal='rename'" :disabled="sel.length!==1">Rename</button>
        <div class="spacer"></div>
        <input type="text" placeholder="Search..." x-model="searchQ" @keydown.enter="search()">
    </div>

    <div class="panels">
        <div class="panel" :class="{active:ap==='left'}" @click="ap='left'">
            <div class="path-bar">
                <button @click="goUp('left')" :disabled="lPath==='/'">↑</button>
                <input x-model="lPath" @keydown.enter="nav('left',lPath)">
            </div>
            <div class="file-header"><span class="col-name">Name</span><span class="col-size">Size</span><span class="col-date">Modified</span></div>
            <div class="file-list">
                <template x-if="lLoad"><div class="loading">Loading...</div></template>
                <template x-if="lErr"><div class="error-msg" x-text="lErr"></div></template>
                <template x-if="!lLoad && !lErr && !lItems.length"><div class="empty">Empty</div></template>
                <template x-if="!lLoad && !lErr && lPath!=='/'">
                    <div class="file-item" @dblclick="goUp('left')"><span class="icon">📁</span><span class="name">..</span><span class="size"></span><span class="date"></span></div>
                </template>
                <template x-for="i in lItems" :key="i.path">
                    <div class="file-item" :class="{selected:isSel('left',i)}" @click="selItem('left',i,$event)" @dblclick="open('left',i)">
                        <span class="icon" x-text="i.isDir?'📁':'📄'"></span>
                        <span class="name" x-text="i.name"></span>
                        <span class="size" x-text="i.isDir?'':fmtSize(i.size)"></span>
                        <span class="date" x-text="fmtDate(i.modified)"></span>
                    </div>
                </template>
            </div>
        </div>

        <div class="panel" :class="{active:ap==='right'}" @click="ap='right'">
            <div class="path-bar">
                <button @click="goUp('right')" :disabled="rPath==='/'">↑</button>
                <input x-model="rPath" @keydown.enter="nav('right',rPath)">
            </div>
            <div class="file-header"><span class="col-name">Name</span><span class="col-size">Size</span><span class="col-date">Modified</span></div>
            <div class="file-list">
                <template x-if="rLoad"><div class="loading">Loading...</div></template>
                <template x-if="rErr"><div class="error-msg" x-text="rErr"></div></template>
                <template x-if="!rLoad && !rErr && !rItems.length"><div class="empty">Empty</div></template>
                <template x-if="!rLoad && !rErr && rPath!=='/'">
                    <div class="file-item" @dblclick="goUp('right')"><span class="icon">📁</span><span class="name">..</span><span class="size"></span><span class="date"></span></div>
                </template>
                <template x-for="i in rItems" :key="i.path">
                    <div class="file-item" :class="{selected:isSel('right',i)}" @click="selItem('right',i,$event)" @dblclick="open('right',i)">
                        <span class="icon" x-text="i.isDir?'📁':'📄'"></span>
                        <span class="name" x-text="i.name"></span>
                        <span class="size" x-text="i.isDir?'':fmtSize(i.size)"></span>
                        <span class="date" x-text="fmtDate(i.modified)"></span>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <span x-text="sel.length?sel.length+' selected':'Ready'"></span>
        <span>ListDAV v1.0.0</span>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" x-show="modal==='mkdir'" x-cloak @click.self="modal=null">
        <div class="modal">
            <h3>New Folder</h3>
            <input type="text" x-model="mkdirName" placeholder="Folder name" @keydown.enter="mkdir()" x-ref="mkdirIn">
            <div class="modal-btns">
                <button class="cancel" @click="modal=null">Cancel</button>
                <button class="confirm" @click="mkdir()">Create</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" x-show="modal==='rename'" x-cloak @click.self="modal=null">
        <div class="modal">
            <h3>Rename</h3>
            <input type="text" x-model="renameVal" @keydown.enter="rename()" x-ref="renameIn">
            <div class="modal-btns">
                <button class="cancel" @click="modal=null">Cancel</button>
                <button class="confirm" @click="rename()">Rename</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" x-show="modal==='delete'" x-cloak @click.self="modal=null">
        <div class="modal">
            <h3>Delete</h3>
            <p style="margin-bottom:16px">Delete <span x-text="sel.length"></span> item(s)?</p>
            <div class="modal-btns">
                <button class="cancel" @click="modal=null">Cancel</button>
                <button class="danger" @click="del()">Delete</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" x-show="modal==='copy'||modal==='move'" x-cloak @click.self="modal=null">
        <div class="modal">
            <h3 x-text="modal==='copy'?'Copy':'Move'"></h3>
            <p style="margin-bottom:16px"><span x-text="sel.length"></span> item(s) → <span x-text="otherPath()"></span></p>
            <div class="modal-btns">
                <button class="cancel" @click="modal=null">Cancel</button>
                <button class="confirm" @click="modal==='copy'?copy():move()" x-text="modal==='copy'?'Copy':'Move'"></button>
            </div>
        </div>
    </div>

    <div class="toast-box" x-ref="toasts"></div>

    <script>
    function fm(){return{
        ap:'left',lPath:'/',rPath:'/',lItems:[],rItems:[],lLoad:false,rLoad:false,lErr:null,rErr:null,
        sel:[],selPanel:null,modal:null,mkdirName:'',renameVal:'',searchQ:'',csrf:'',

        get currentPath(){return this.ap==='left'?this.lPath:this.rPath},

        init(){
            const m=document.querySelector('meta[name="csrf-token"]');
            if(m)this.csrf=m.content;
            this.nav('left','/');
            this.nav('right','/youtube/playlists');
            document.addEventListener('keydown',e=>{
                if(this.modal)return;
                if(e.key==='Tab'){e.preventDefault();this.ap=this.ap==='left'?'right':'left'}
                if(e.key==='F5'&&this.sel.length){e.preventDefault();this.modal='copy'}
                if(e.key==='F6'&&this.sel.length){e.preventDefault();this.modal='move'}
                if(e.key==='F7'){e.preventDefault();this.modal='mkdir'}
                if((e.key==='F8'||e.key==='Delete')&&this.sel.length){e.preventDefault();this.modal='delete'}
                if(e.key==='Backspace'){e.preventDefault();this.goUp()}
                if(e.ctrlKey&&e.key==='a'){e.preventDefault();this.selAll()}
            });
        },

        async nav(p,path){
            if(p==='left'){this.lPath=path;this.lLoad=true;this.lErr=null}
            else{this.rPath=path;this.rLoad=true;this.rErr=null}
            try{
                const r=await fetch('/ui/api/browse?path='+encodeURIComponent(path));
                const d=await r.json();
                if(d.success){if(p==='left')this.lItems=d.items;else this.rItems=d.items}
                else{if(p==='left')this.lErr=d.error;else this.rErr=d.error}
            }catch(e){if(p==='left')this.lErr='Network error';else this.rErr='Network error'}
            if(p==='left')this.lLoad=false;else this.rLoad=false;
            if(this.selPanel===p){this.sel=[];this.selPanel=null}
        },

        refresh(p){p=p||this.ap;this.nav(p,p==='left'?this.lPath:this.rPath)},
        goUp(p){p=p||this.ap;const cp=p==='left'?this.lPath:this.rPath;if(cp==='/')return;this.nav(p,cp.split('/').slice(0,-1).join('/')||'/')},
        otherPath(){return this.ap==='left'?this.rPath:this.lPath},

        selItem(p,i,e){
            if(this.selPanel!==p){this.sel=[];this.selPanel=p}
            if(e.ctrlKey){const x=this.sel.findIndex(s=>s.path===i.path);if(x>=0)this.sel.splice(x,1);else this.sel.push(i)}
            else this.sel=[i];
            this.ap=p;
        },
        isSel(p,i){return this.selPanel===p&&this.sel.some(s=>s.path===i.path)},
        selAll(){const items=this.ap==='left'?this.lItems:this.rItems;this.sel=[...items];this.selPanel=this.ap},

        open(p,i){
            if(i.isDir)this.nav(p,i.path);
            else if(i.name.endsWith('.url'))this.openUrl(i.path);
        },
        async openUrl(path){
            try{
                const r=await fetch('/ui/api/file?path='+encodeURIComponent(path));
                const d=await r.json();
                if(d.success){const m=d.content.match(/URL=(.+)/);if(m)window.open(m[1].trim(),'_blank')}
            }catch(e){}
        },

        async mkdir(){
            if(!this.mkdirName)return;
            const path=this.ap==='left'?this.lPath:this.rPath;
            try{
                const r=await fetch('/ui/api/mkdir',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':this.csrf},body:JSON.stringify({path,name:this.mkdirName})});
                const d=await r.json();
                if(d.success){this.toast('Folder created','success');this.refresh()}else this.toast(d.error,'error');
            }catch(e){this.toast('Error','error')}
            this.modal=null;this.mkdirName='';
        },

        async rename(){
            if(!this.renameVal||this.sel.length!==1)return;
            try{
                const r=await fetch('/ui/api/rename',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':this.csrf},body:JSON.stringify({path:this.sel[0].path,newName:this.renameVal})});
                const d=await r.json();
                if(d.success){this.toast('Renamed','success');this.sel=[];this.refresh()}else this.toast(d.error,'error');
            }catch(e){this.toast('Error','error')}
            this.modal=null;
        },

        async copy(){
            const dest=this.otherPath();
            try{
                const r=await fetch('/ui/api/copy',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':this.csrf},body:JSON.stringify({sources:this.sel.map(s=>s.path),destination:dest})});
                const d=await r.json();
                if(d.success){this.toast('Copied','success');this.refresh('left');this.refresh('right')}else this.toast(d.error,'error');
            }catch(e){this.toast('Error','error')}
            this.modal=null;
        },

        async move(){
            const dest=this.otherPath();
            try{
                const r=await fetch('/ui/api/move',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':this.csrf},body:JSON.stringify({sources:this.sel.map(s=>s.path),destination:dest})});
                const d=await r.json();
                if(d.success){this.toast('Moved','success');this.sel=[];this.refresh('left');this.refresh('right')}else this.toast(d.error,'error');
            }catch(e){this.toast('Error','error')}
            this.modal=null;
        },

        async del(){
            try{
                const r=await fetch('/ui/api/delete',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':this.csrf},body:JSON.stringify({paths:this.sel.map(s=>s.path)})});
                const d=await r.json();
                if(d.success){this.toast('Deleted','success');this.sel=[];this.refresh()}else this.toast(d.error,'error');
            }catch(e){this.toast('Error','error')}
            this.modal=null;
        },

        async search(){
            if(!this.searchQ)return;
            try{
                const r=await fetch('/ui/api/search?q='+encodeURIComponent(this.searchQ)+'&path='+encodeURIComponent(this.currentPath));
                const d=await r.json();
                if(d.success){
                    if(this.ap==='left')this.lItems=d.results;else this.rItems=d.results;
                    this.toast('Found '+d.results.length,'success');
                }
            }catch(e){}
        },

        fmtSize(b){if(!b)return'';const u=['B','KB','MB','GB'];let i=0;while(b>=1024&&i<3){b/=1024;i++}return b.toFixed(i?1:0)+' '+u[i]},
        fmtDate(d){return d?d.substring(0,16).replace('T',' '):''},
        toast(msg,type){
            const t=document.createElement('div');
            t.className='toast '+type;
            t.textContent=msg;
            this.$refs.toasts.appendChild(t);
            setTimeout(()=>t.remove(),3000);
        }
    }}
    </script>
</body>
</html>
